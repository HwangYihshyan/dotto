# docker compose up で API・PostgreSQL・Redis をまとめて起動する。
# 値は .env から読み込む（.env.example をコピーして作る）。

services:
  api:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      # コンテナ同士はサービス名（db, redis）で名前解決できる
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      # 「起動した」ではなく「healthcheck が通った」まで待ってから api を起動する
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data      # データを永続化（コンテナを消しても残る）
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"                  # 自分のPCからだけ接続できるようにする
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
